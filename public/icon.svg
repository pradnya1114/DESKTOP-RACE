<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73f7ff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer metallic border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#222b3d" stroke-width="6"/>
  <rect x="28" y="28" width="456" height="456" rx="86" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Speed motion arcs (Desk Coaster loop tracks) -->
  <path d="M 90 370 C 90 220, 210 120, 350 120 C 420 120, 440 180, 390 230 C 330 290, 200 310, 140 370" 
        fill="none" stroke="#1d2636" stroke-width="26" stroke-linecap="round"/>
  <path d="M 90 370 C 90 220, 210 120, 350 120 C 420 120, 440 180, 390 230 C 330 290, 200 310, 140 370" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Secondary amber dynamic curb streak -->
  <path d="M 160 388 C 220 338, 330 320, 380 270" 
        fill="none" stroke="url(#amberGrad)" stroke-width="7" stroke-dasharray="14 10" stroke-linecap="round"/>

  <!-- Micro-Kart Silhouette Top-Down Isometric Angle -->
  <g transform="translate(240, 230) rotate(-22)" filter="url(#neonGlow)">
    <!-- Shadow -->
    <rect x="-46" y="-66" width="92" height="132" rx="20" fill="#000000" opacity="0.6"/>
    <!-- Kart Body Frame -->
    <rect x="-42" y="-62" width="84" height="124" rx="18" fill="#182234" stroke="url(#cyanGrad)" stroke-width="5"/>
    
    <!-- Front Bumper / Wing -->
    <path d="M -52 -54 L 52 -54 L 46 -36 L -46 -36 Z" fill="url(#cyanGrad)"/>
    <!-- Rear Wing -->
    <rect x="-50" y="44" width="100" height="16" rx="4" fill="url(#amberGrad)"/>
    
    <!-- Wheels -->
    <rect x="-56" y="-46" width="12" height="28" rx="4" fill="#0a0c10" stroke="#00e5ff" stroke-width="2"/>
    <rect x="44" y="-46" width="12" height="28" rx="4" fill="#0a0c10" stroke="#00e5ff" stroke-width="2"/>
    <rect x="-56" y="24" width="12" height="32" rx="4" fill="#0a0c10" stroke="#00e5ff" stroke-width="2"/>
    <rect x="44" y="24" width="12" height="32" rx="4" fill="#0a0c10" stroke="#00e5ff" stroke-width="2"/>
    
    <!-- Cockpit & Driver Helmet -->
    <ellipse cx="0" cy="-6" rx="20" ry="24" fill="#0d111a" stroke="#334155" stroke-width="3"/>
    <!-- Visor -->
    <path d="M -14 -12 Q 0 -18 14 -12 Q 10 -4 0 -4 Q -10 -4 -14 -12 Z" fill="#00e5ff"/>
    <!-- Kart Number '1' -->
    <text x="0" y="28" font-family="'Orbitron', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- Speed dashes / dust particles -->
  <circle cx="110" cy="380" r="4" fill="#00e5ff" opacity="0.8"/>
  <circle cx="85" cy="405" r="3" fill="#ffe259" opacity="0.9"/>
  <circle cx="135" cy="415" r="5" fill="#00e5ff" opacity="0.6"/>
  <line x1="60" y1="365" x2="105" y2="365" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="45" y1="385" x2="80" y2="385" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>
